ng"};let save="";if(db){try{const ref=await db.collection("orders").add(order);save="Order reference: "+ref.id+"\n"}catch(e){console.error(e);save="Online order record could not be saved. Please confirm with the store.\n"}}const msg=save+"New order - Jagadamba Medical\nCustomer: "+name+"\nPhone: "+phone+"\nMode: "+(mode==="delivery"?"Home delivery":"Store pickup")+"\n"+(mode==="delivery"?"Address: "+address+"\n":"")+"\n"+order.items.map(i=>i.name+" x"+i.qty+" - "+money(i.qty*i.price)).join("\n")+"\nTotal: "+money(total)+(order.needsPrescription?"\nPrescription required.": "");$("status").textContent="Opening WhatsApp to send your order…";window.open("https://wa.me/917066775820?text="+encodeURIComponent(msg),"_blank");cart={};render();};}
