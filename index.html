<script>
  window.storage = {
    async get(key, shared) {
      try {
        const raw = localStorage.getItem((shared ? "shared:" : "priv:") + key);
        if (raw === null || raw === undefined) return null;
        return { key: key, value: raw, shared: !!shared };
      } catch (e) {
        return null;
      }
    },
    async set(key, value, shared) {
      localStorage.setItem((shared ? "shared:" : "priv:") + key, value);
      return { key: key, value: value, shared: !!shared };
    },
    async delete(key, shared) {
      localStorage.removeItem((shared ? "shared:" : "priv:") + key);
      return { key: key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared) {
      const p = (shared ? "shared:" : "priv:") + (prefix || "");
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf(p) === 0) keys.push(k.slice((shared ? "shared:" : "priv:").length));
      }
      return { keys: keys, prefix: prefix, shared: !!shared };
    },
  };

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>

    `New order ${order.id}`,

    `Mode: ${order.customer.mode === "delivery" ? "Home delivery" : "Store pickup"}`,

      textAlign: "center",
      padding: "40px 16px",
      color: "#75806F",
      fontSize: "13.5px",
      gridColumn: "1 / -1",
    },
  };

  if (view === "confirmation" && lastOrder) {
    return (
      <div style={styles.page}>
        <div style={styles.header}>
          <h1 style={styles.shopName}>{SHOP.name}</h1>
        </div>
        <div style={styles.confirmWrap}>
          <div style={{ fontSize: "40px" }}>✓</div>
          <p style={{ fontSize: "14px", margin: "8px 0 0" }}>Order placed</p>
          <p style={styles.confirmId}>{lastOrder.id}</p>
          <p style={styles.confirmSub}>
            {lastOrder.customer.mode === "delivery"
              ? "We'll deliver to your address shortly."
              : "Your order will be ready for pickup at the counter."}
          </p>
          {lastOrder.needsPrescription && (
            <div style={{ ...styles.rxNotice, textAlign: "left", marginTop: "20px" }}>
              This order contains prescription items. Please bring or show your prescription
              {lastOrder.customer.mode === "delivery" ? " to the delivery person." : " at the counter."}
            </div>
          )}
          <div style={{ textAlign: "left", marginTop: "24px" }}>
            <p style={styles.sectionTitle}>Order summary</p>
            {lastOrder.items.map((it, idx) => (
              <div key={idx} style={styles.lineItem}>
                <span>{it.name} x{it.qty}</span>
                <span>{formatRupees(it.qty * it.price)}</span>
              </div>
            ))}
            <div style={styles.totalRow}>
              <span>Total</span>
              <span>{formatRupees(lastOrder.total)}</span>
            </div>
          </div>
          <p style={{ ...styles.confirmSub, marginTop: "24px" }}>
            A WhatsApp message with your order should have opened automatically. If it didn't, tap below to send it to the shop.
          </p>
          <a
            href={`https://wa.me/${SHOP.whatsapp}?text=${encodeURIComponent(buildOrderText(lastOrder))}`}
            target="_blank"
            rel="noreferrer"
            style={{ ...styles.placeBtn, marginTop: "14px", display: "block", textAlign: "center", textDecoration: "none", boxSizing: "border-box" }}
          >
            Send order on WhatsApp
          </a>
          <a
            href={`https://wa.me/${SHOP.whatsapp}?text=${encodeURIComponent("Please cancel my order " + lastOrder.id + ". Name: " + lastOrder.customer.name + ", Phone: " + lastOrder.customer.phone)}`}
            target="_blank"
            rel="noreferrer"
            style={{ ...styles.placeBtn, marginTop: "10px", background: "#FFFFFF", color: "#B3341E", border: "1px solid #B3341E", display: "block", textAlign: "center", textDecoration: "none", boxSizing: "border-box" }}
          >
            Cancel this order
          </a>
          <button style={{ ...styles.placeBtn, marginTop: "10px", background: "#FFFFFF", color: "#1E4A3D", border: "1px solid #1E4A3D" }} onClick={startNewOrder}>
            Place another order
          </button>
        </div>
      </div>
    );
  }

  if (view === "checkout") {
    return (
      <div style={styles.page}>
        <div style={styles.header}>
          <h1 style={styles.shopName}>{SHOP.name}</h1>
        </div>
        <div style={styles.checkoutWrap}>
          <button style={styles.backLink} onClick={() => setView("shop")}>
            ← Back to shop
          </button>
          <p style={styles.sectionTitle}>Your order</p>
          {cartList.length === 0 && (
            <p style={{ fontSize: "13px", color: "#75806F" }}>Your cart is empty.</p>
          )}
          {cartList.map((c) => (
            <div key={c.product.id} style={{ ...styles.lineItem, alignItems: "center" }}>
              <span>{c.product.name}</span>
              <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
                <div style={styles.qtyRow}>
                  <button style={styles.qtyBtn} onClick={() => changeQty(c.product.id, -1)}>
                    −
                  </button>
                  <span style={styles.qtyNum}>{c.qty}</span>
                  <button style={styles.qtyBtn} onClick={() => changeQty(c.product.id, 1)}>
                    +
                  </button>
                </div>
                <span style={{ minWidth: "56px", textAlign: "right" }}>{formatRupees(c.qty * priceFor(c.product))}</span>
              </div>
            </div>
          ))}
          <div style={styles.totalRow}>
            <span>Total</span>
            <span>{formatRupees(cartTotal)}</span>
          </div>

          {hasRx && (
            <div style={styles.rxNotice}>
              Your order includes prescription medicines. Keep your prescription ready — the shop will verify it before dispatch or pickup.
            </div>
          )}

          <p style={styles.sectionTitle}>Delivery details</p>

          <span style={styles.label}>Your name</span>
          <input
            style={styles.input}
            placeholder="Full name"
            value={form.name}
            onChange={(e) => setForm({ ...form, name: e.target.value })}
          />
          {formErrors.name && <div style={styles.errorText}>{formErrors.name}</div>}

          <span style={styles.label}>Phone number</span>
          <input
            style={styles.input}
            placeholder="10-digit mobile number"
            value={form.phone}
            onChange={(e) => setForm({ ...form, phone: e.target.value.replace(/[^0-9]/g, "") })}
            maxLength={10}
          />
          {formErrors.phone && <div style={styles.errorText}>{formErrors.phone}</div>}

          <span style={styles.label}>Order mode</span>
          <div style={styles.modeRow}>
            <button
              style={styles.modeBtn(form.mode === "delivery")}
              onClick={() => setForm({ ...form, mode: "delivery" })}
            >
              Home delivery
            </button>
            <button
              style={styles.modeBtn(form.mode === "pickup")}
              onClick={() => setForm({ ...form, mode: "pickup" })}
            >
              Store pickup
            </button>
          </div>

          {form.mode === "delivery" && (
            <>
              <span style={styles.label}>Delivery address</span>
              <input
                style={styles.input}
                placeholder="House no, street, area, landmark"
                value={form.address}
                onChange={(e) => setForm({ ...form, address: e.target.value })}
              />
              {formErrors.address && <div style={styles.errorText}>{formErrors.address}</div>}
            </>
          )}

          <button
            style={{ ...styles.placeBtn, opacity: cartList.length === 0 ? 0.5 : 1 }}
            onClick={placeOrder}
            disabled={cartList.length === 0}
          >
            Place order · {formatRupees(cartTotal)}
          </button>
        </div>
      </div>
    );
  }

  if (view === "owner-login") {
    return (
      <div style={styles.page}>
        <div style={styles.header}>
          <h1 style={styles.shopName}>{SHOP.name}</h1>
        </div>
        <div style={styles.checkoutWrap}>
          <button style={styles.backLink} onClick={() => setView("shop")}>
            ← Back to shop
          </button>
          <p style={styles.sectionTitle}>Owner login</p>
          <span style={styles.label}>Email</span>
          <input
            style={styles.input}
            type="email"
            autoCapitalize="none"
            placeholder="owner@example.com"
            value={ownerEmail}
            onChange={(e) => setOwnerEmail(e.target.value)}
          />
          <span style={styles.label}>Password</span>
          <input
            style={styles.input}
            type="password"
            placeholder="Password"
            value={ownerPassword}
            onChange={(e) => setOwnerPassword(e.target.value)}
          />
          {ownerError && <div style={styles.errorText}>{ownerError}</div>}
          <button
            style={styles.placeBtn}
            onClick={async () => {
              setOwnerError("");
              try {
                await window.auth.signInWithEmailAndPassword(ownerEmail.trim(), ownerPassword);
                setOwnerPassword("");
                setView("owner-panel");
              } catch (e) {
                setOwnerError("Incorrect email or password");
              }
            }}
          >
            Log in
          </button>
        </div>
      </div>
    );
  }

  if (view === "owner-panel") {
    return (
      <div style={styles.page}>
        <div style={styles.header}>
          <h1 style={styles.shopName}>{SHOP.name}</h1>
        </div>
        <div style={styles.checkoutWrap}>
          <button style={styles.backLink} onClick={() => setView("shop")}>
            ← Back to shop
          </button>

          {authChecked && !isOwner ? (
            <div>
              <p style={styles.sectionTitle}>You've been signed out</p>
              <button style={styles.placeBtn} onClick={() => setView("owner-login")}>
                Log in again
              </button>
            </div>
          ) : (
            <>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <p style={styles.sectionTitle}>Add a new item</p>
                <button
                  style={{ background: "none", border: "none", color: "#75806F", fontSize: "12.5px" }}
                  onClick={() => {
                    window.auth.signOut();
                    setView("shop");
                  }}
                >
                  Sign out
                </button>
              </div>

          <span style={styles.label}>Item name</span>
          <input
            style={styles.input}
            placeholder="e.g. Elastic Crepe Bandage"
            value={newProduct.name}
            onChange={(e) => setNewProduct({ ...newProduct, name: e.target.value })}
          />

          <span style={styles.label}>Pack size</span>
          <input
            style={styles.input}
            placeholder="e.g. 1 roll, Strip of 10"
            value={newProduct.pack}
            onChange={(e) => setNewProduct({ ...newProduct, pack: e.target.value })}
          />

          <span style={styles.label}>Price (₹)</span>
          <input
            style={styles.input}
            type="number"
            inputMode="numeric"
            placeholder="e.g. 199"
            value={newProduct.price}
            onChange={(e) => setNewProduct({ ...newProduct, price: e.target.value })}
          />

          <span style={styles.label}>Category</span>
          <select
            style={styles.input}
            value={newProduct.category}
            onChange={(e) => setNewProduct({ ...newProduct, category: e.target.value })}
          >
            {CATEGORIES.filter((c) => c !== "All").map((c) => (
              <option key={c} value={c}>
                {c}
              </option>
            ))}
          </select>

          <span style={styles.label}>Photo link (optional)</span>
          <input
            style={styles.input}
            placeholder="Paste an image URL, or leave blank for an icon"
            value={newProduct.image}
            onChange={(e) => setNewProduct({ ...newProduct, image: e.target.value })}
          />

          <div style={{ display: "flex", alignItems: "center", gap: "8px", marginTop: "14px" }}>
            <input
              type="checkbox"
              id="rx-check"
              checked={newProduct.rx}
              onChange={(e) => setNewProduct({ ...newProduct, rx: e.target.checked })}
            />
            <label htmlFor="rx-check" style={{ fontSize: "13px" }}>
              Requires a prescription
            </label>
          </div>

          {newProductError && <div style={styles.errorText}>{newProductError}</div>}

          <button style={styles.placeBtn} onClick={addCustomProduct}>
            Add item to shop
          </button>

          <p style={{ ...styles.sectionTitle, marginTop: "28px" }}>Items you've added</p>
          {customProducts.length === 0 && (
            <p style={{ fontSize: "13px", color: "#75806F" }}>No extra items added yet.</p>
          )}
          {customProducts.map((p) => (
            <div key={p.id} style={styles.lineItem}>
              <span>
                {p.name} · {p.pack} · {p.category}
              </span>
              <button
                style={{ background: "none", border: "none", color: "#B3341E", fontSize: "12.5px", fontWeight: 600 }}
                onClick={() => removeCustomProduct(p.id)}
              >
                Remove
              </button>
            </div>
          ))}

          <p style={{ ...styles.sectionTitle, marginTop: "28px" }}>Put an item on sale</p>
          <span style={styles.label}>Choose item</span>
          <select
            style={styles.input}
            value={saleProductId}
            onChange={(e) => setSaleProductId(e.target.value)}
          >
            <option value="">Select a product</option>
            {allProducts.map((p) => (
              <option key={p.id} value={p.id}>
                {p.name} (regular {formatRupees(p.price)})
              </option>
            ))}
          </select>
          <span style={styles.label}>Sale price (₹)</span>
          <input
            style={styles.input}
            type="number"
            inputMode="numeric"
            placeholder="e.g. 149"
            value={salePriceInput}
            onChange={(e) => setSalePriceInput(e.target.value)}
          />
          {saleError && <div style={styles.errorText}>{saleError}</div>}
          <button style={styles.placeBtn} onClick={setSaleForProduct}>
            Start sale
          </button>

          <p style={{ ...styles.sectionTitle, marginTop: "20px" }}>Items currently on sale</p>
          {Object.keys(sales).length === 0 && (
            <p style={{ fontSize: "13px", color: "#75806F" }}>No items on sale right now.</p>
          )}
          {Object.entries(sales).map(([id, salePrice]) => {
            const product = allProducts.find((p) => p.id === id);
            if (!product) return null;
            return (
              <div key={id} style={styles.lineItem}>
                <span>
                  {product.name} · <span style={{ textDecoration: "line-through", color: "#9AA593" }}>{formatRupees(product.price)}</span> → {formatRupees(salePrice)}
                </span>
                <button
                  style={{ background: "none", border: "none", color: "#B3341E", fontSize: "12.5px", fontWeight: 600 }}
                  onClick={() => endSale(id)}
                >
                  End sale
                </button>
              </div>
            );
          })}

          <p style={{ ...styles.sectionTitle, marginTop: "28px" }}>Recent orders</p>
          {ownerOrders.length === 0 && (
            <p style={{ fontSize: "13px", color: "#75806F" }}>No orders yet.</p>
          )}
          {ownerOrders.map((o) => (
            <div key={o.id} style={{ ...styles.lineItem, flexDirection: "column", alignItems: "flex-start", gap: "4px" }}>
              <div style={{ display: "flex", justifyContent: "space-between", width: "100%", fontWeight: 600 }}>
                <span>{o.id || o.customer?.name}</span>
                <span>{formatRupees(o.total)}</span>
              </div>
              <span style={{ fontSize: "12px", color: "#75806F" }}>
                {o.customer?.name} · {o.customer?.phone} · {o.customer?.mode === "delivery" ? "Delivery" : "Pickup"}
              </span>
            </div>
          ))}
            </>
          )}
        </div>
      </div>
    );
  }

  return (
    <div style={styles.page}>
      <div style={styles.header}>
        <h1 style={styles.shopName}>{SHOP.name}</h1>
        <p style={styles.tagline}>{SHOP.tagline}</p>
        <div style={styles.searchWrap}>
          <input
            style={styles.searchInput}
            placeholder="Search medicines and health products"
            value={query}
            onChange={(e) => setQuery(e.target.value)}
          />
        </div>
      </div>

      <div style={styles.chipRow}>
        {CATEGORIES.map((c) => (
          <button key={c} style={styles.chip(category === c)} onClick={() => setCategory(c)}>
            {c}
          </button>
        ))}
      </div>

      <div style={styles.grid}>
        {items.length === 0 && <div style={styles.emptyState}>No products match your search.</div>}
        {items.map((p) => {
          const qty = cart[p.id] || 0;
          const onSale = sales[p.id] != null;
          const effectivePrice = priceFor(p);
          return (
            <div key={p.id} style={styles.card}>
              <div style={styles.imageWrap}>{p.image ? <img src={p.image} alt={p.name} style={{ width: "100%", height: "100%", objectFit: "cover", borderRadius: "10px" }} /> : getIcon(p.category)}</div>
              {onSale && <span style={{ ...styles.rxBadge, color: "#8A5A0C", background: "#FBE8C8" }}>Sale</span>}
              {p.rx && <span style={styles.rxBadge}>Prescription required</span>}
              <p style={styles.prodName}>{p.name}</p>
              <p style={styles.prodPack}>{p.pack}</p>
              <div style={styles.priceRow}>
                <span>
                  {onSale && (
                    <span style={{ fontSize: "12px", color: "#9AA593", textDecoration: "line-through", marginRight: "6px" }}>
                      {formatRupees(p.price)}
                    </span>
                  )}
                  <span style={styles.price}>{formatRupees(effectivePrice)}</span>
                </span>
                {qty === 0 ? (
                  <button style={styles.addBtn} onClick={() => addToCart(p.id)}>
                    Add
                  </button>
                ) : (
                  <div style={styles.qtyRow}>
                    <button style={styles.qtyBtn} onClick={() => changeQty(p.id, -1)}>
                      −
                    </button>
                    <span style={styles.qtyNum}>{qty}</span>
                    <button style={styles.qtyBtn} onClick={() => changeQty(p.id, 1)}>
                      +
                    </button>
                  </div>
                )}
              </div>
            </div>
          );
        })}
      </div>

      {cartCount > 0 && (
        <div style={styles.cartBar}>
          <span style={styles.cartBarText}>
            {cartCount} item{cartCount > 1 ? "s" : ""} · {formatRupees(cartTotal)}
          </span>
          <button style={styles.cartBarBtn} onClick={() => setView("checkout")}>
            View cart
          </button>
        </div>
      )}

      <div style={{ textAlign: "center", padding: "10px 16px 20px" }}>
        <button
          style={{ background: "none", border: "none", fontSize: "12px", color: "#9AA593" }}
          onClick={() => setView(isOwner ? "owner-panel" : "owner-login")}
        >
          Shop owner
        </button>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
